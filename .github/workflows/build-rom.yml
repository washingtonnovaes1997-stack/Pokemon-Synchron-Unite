name: Build ROM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: synchron-unite-rom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout game project
        uses: actions/checkout@v4

      - name: Install ARM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi git libpng-dev python3

      - name: Generate Aurelis world data
        run: python3 tools/generate_world.py

      - name: Generate physical map blueprints
        run: python3 tools/generate_maps.py

      - name: Validate custom project
        run: python3 tools/validate_project.py

      - name: Validate physical maps
        run: python3 tools/validate_maps.py

      - name: Fetch pinned pokeemerald-expansion engine
        run: |
          mkdir engine
          git -C engine init
          git -C engine remote add origin https://github.com/rh-hideout/pokeemerald-expansion.git
          git -C engine fetch --depth 1 origin cafe0221cefb2a991cc0ece429174ade877d037d
          git -C engine checkout --detach FETCH_HEAD

      - name: Integrate Aurelis as native engine maps
        run: python3 tools/integrate_native_maps.py --project . --engine engine

      - name: Validate native engine integration
        run: python3 tools/validate_native_engine.py --engine engine

      - name: Apply generated custom game overlay
        run: python3 tools/apply_overlay.py --project . --engine engine

      - name: Build ROM
        working-directory: engine
        run: make -j"$(nproc)"

      - name: Collect ROM and build metadata
        run: |
          mkdir -p dist
          cp engine/pokeemerald.gba dist/Pokemon-Synchron-Unite.gba
          sha256sum dist/Pokemon-Synchron-Unite.gba > dist/Pokemon-Synchron-Unite.sha256
          cp generated/world_index.json dist/world_index.json
          cp generated/world_summary.txt dist/world_summary.txt
          cp generated/maps/map_build_index.json dist/map_build_index.json
          cp generated/maps/interiors.json dist/interiors.json
          cp generated/native_integration.json dist/native_integration.json
          cp game/assets/tileset_manifest.json dist/tileset_manifest.json

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Synchron-Unite-ROM
          path: |
            dist/Pokemon-Synchron-Unite.gba
            dist/Pokemon-Synchron-Unite.sha256
            dist/world_index.json
            dist/world_summary.txt
            dist/map_build_index.json
            dist/interiors.json
            dist/native_integration.json
            dist/tileset_manifest.json
          if-no-files-found: error
          retention-days: 30
