name: Build TVBrasil APK

on:
  push:
    branches: [ tvbrasil-apk-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          out = bytearray()
          for i in range(4):
              s = Path(f'tvbuild/part_{i:02d}.b64').read_text(encoding='utf-8')
              clean = ''.join(c for c in s if c.isalnum() or c in '+/=')
              out.extend(base64.b64decode(clean, validate=False))
          for i in range(4, 8):
              out.extend(Path(f'tvbuild/part_{i:02d}.bin').read_bytes())
          Path('source.tar.gz').write_bytes(out)
          print('source bytes:', len(out))
          PY
          mkdir appsrc
          tar -xzf source.tar.gz -C appsrc

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: appsrc
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TVBrasilPlus-2.1-debug
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
